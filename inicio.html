{% extends 'base.html' %}

{% block title %}Inicio | Cine{% endblock %}

{% block content %}
<h1 class="mb-4">Bienvenido al cine</h1>
<p class="lead">Elige un género para ver sus películas.</p>

<div class="row">
    {% for g in generos %}
    <div class="col-md-6 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">{{ g.nombre }}</h2>
                <p class="card-text">{{ g.descripcion }}</p>
                <a href="{% url 'home:genero' g.slug %}" class="btn btn-primary">Ver películas</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
